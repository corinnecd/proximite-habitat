name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      # Lint bloquant (0 erreur). Les conseils React Compiler restent en `warn`
      # (cf. eslint.config.mjs) : visibles mais non bloquants.
      - name: Lint
        run: npm run lint
